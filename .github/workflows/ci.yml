name: CI

# 触发：push 与 pull_request 都必须通过完整校验
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-scripts:
    name: Startup scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Startup and integrity regression tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @('easyoactl.ps1') + @(Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
  # ---------------------------------------------------------------------------
  # 后端：编译 + 单元测试 + 集成测试（Testcontainers 真实 PostgreSQL）+ 打包
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile
        run: ./mvnw -B -DskipTests compile

      - name: Test (unit + integration, Testcontainers)
        run: ./mvnw -B test

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: easyoa-api-jar
          path: backend/target/easyoa-api-*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 前端：依赖安装 + 类型检查 + 构建
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (TypeScript strict)
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: easyoa-web-dist
          path: frontend/dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 部署编排校验：Compose 配置必须可解析（防止上线前才发现语法/变量错误）
  # ---------------------------------------------------------------------------
  compose-config:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Validate production compose
        run: docker compose -f docker-compose.yml config -q

      - name: Validate dev compose
        run: docker compose -f docker-compose.dev.yml config -q

      - name: Verify actual Nginx routing and trusted proxy headers
        env:
          EASYOA_TEST_DOCKER_PROXY: '1'
        run: python3 scripts/tests/test_proxy.py

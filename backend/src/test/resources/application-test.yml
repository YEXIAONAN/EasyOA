# 集成测试环境：数据源由 Testcontainers 提供（@ServiceConnection），不产生种子数据
server:
  servlet:
    session:
      cookie:
        secure: false

easyoa:
  security:
    session-secret: integration-test-session-secret-not-for-production-32
    login-max-failures: 5
    login-lock-minutes: 15
  storage:
    # 附件写入临时目录；大小限制调小便于测试「超限拒绝」
    path: ${java.io.tmpdir}/easyoa-test-storage
    max-file-size: 1048576
  notifications:
    scheduler:
      # 集成测试关闭定时扫描（通知在用例中通过业务动作触发）
      enabled: false

logging:
  level:
    com.easyoa: INFO
    EASYOA_ACCESS: WARN
# =============================================================================
# EasyOA 本地开发编排：只启动 PostgreSQL
# -----------------------------------------------------------------------------
# 后端与前端在本机直接运行（更快、可断点调试）：
#   1) docker compose -f docker-compose.dev.yml up -d
#   2) cd backend && ./mvnw spring-boot:run        （dev profile，自动注入种子数据）
#   3) cd frontend && npm run dev                  （http://localhost:5173）
#
# 数据库仅绑定 127.0.0.1，不对局域网/公网暴露。
# =============================================================================
name: easyoa-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easyoa}
      POSTGRES_USER: ${POSTGRES_USER:-easyoa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easyoa_dev_password}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev-data:
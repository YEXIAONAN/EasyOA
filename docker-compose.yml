# =============================================================================
# EasyOA 生产编排
# -----------------------------------------------------------------------------
#   Internet → 443(HTTPS) → nginx → easyoa-api → postgres
#                                    ↘ easyoa-web（静态资源）
#
# 安全约定：
#   * postgres 不映射任何宿主机端口，仅容器内部网络可访问；
#   * 只有 nginx 暴露 80 / 443；
#   * 密钥全部来自 .env（不提交仓库）。
#
# 使用：
#   Signed release: ./easyoactl install / start
#   Source development: ./easyoactl dev
# =============================================================================
name: easyoa

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 未配置}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 未配置}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未配置}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - easyoa-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  easyoa-api:
    build:
      context: ./backend
      args:
        RELEASE_KEY_FINGERPRINT: ${EASYOA_RELEASE_KEY_FINGERPRINT:-}
        SOURCE_REF: ${EASYOA_SOURCE_REF:-}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${EASYOA_PROFILE:-prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EASYOA_SESSION_SECRET: ${EASYOA_SESSION_SECRET:?EASYOA_SESSION_SECRET 未配置}
      EASYOA_BASE_URL: ${EASYOA_BASE_URL:-https://localhost}
      EASYOA_SOURCE_URL: ${EASYOA_SOURCE_URL:-}
      EASYOA_SESSION_TIMEOUT_MINUTES: ${EASYOA_SESSION_TIMEOUT_MINUTES:-480}
      EASYOA_LOGIN_MAX_FAILURES: ${EASYOA_LOGIN_MAX_FAILURES:-5}
      EASYOA_LOGIN_LOCK_MINUTES: ${EASYOA_LOGIN_LOCK_MINUTES:-15}
      EASYOA_STORAGE_PATH: ${EASYOA_STORAGE_PATH:-/var/lib/easyoa/storage}
      TZ: UTC
    volumes:
      - easyoa-storage:${EASYOA_STORAGE_PATH:-/var/lib/easyoa/storage}
      - ./integrity:/opt/easyoa-integrity:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - easyoa-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  easyoa-web:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - easyoa-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EASYOA_HTTP_PORT:-80}:80"
      - "${EASYOA_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${EASYOA_TLS_CERT_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      easyoa-api:
        condition: service_healthy
      easyoa-web:
        condition: service_started
    networks:
      - easyoa-internal

volumes:
  postgres-data:
  easyoa-storage:

networks:
  easyoa-internal:
    driver: bridge

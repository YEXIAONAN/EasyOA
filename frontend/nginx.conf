# EasyOA Web 容器内部 Nginx：仅负责静态资源与 SPA 回退（不处理 TLS / 反向代理）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点（供 docker healthcheck 与边缘 Nginx 使用）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带指纹的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证前端发布后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}
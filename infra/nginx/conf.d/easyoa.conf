# =============================================================================
# EasyOA 站点配置
#   80  → 全部重定向到 HTTPS
#   443 → HTTPS：/api 与 /actuator/health 走 easyoa-api，其余走 easyoa-web
# =============================================================================

upstream easyoa_api {
    server easyoa-api:8080;
    keepalive 16;
}

upstream easyoa_web {
    server easyoa-web:80;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP：仅用于跳转与 ACME 校验
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 证书签发（certbot webroot）预留位置
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS 主站
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/easyoa.crt;
    ssl_certificate_key /etc/nginx/certs/easyoa.key;

    # --- 安全响应头 -----------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：前端为同源 SPA（Element Plus 需要内联样式），不允许外部资源
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- 反向代理通用头 -------------------------------------------------------
    # 强制覆盖（而不是追加）客户端可伪造的转发头，保证后端看到的 IP 可信
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $request_id;
    proxy_http_version 1.1;
    # Child locations must inherit the whole header set; a local directive
    # replaces it and would send the upstream alias (with an underscore) as Host.
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # --- 健康检查（仅本机 / 容器网络可达语义：这里只放行健康端点） -------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- 后端 API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://easyoa_api;
    }

    # Actuator 仅暴露健康检查，其余一律拒绝
    location = /actuator/health {
        proxy_pass http://easyoa_api;
        access_log off;
    }

    location /actuator/ {
        return 404;
    }

    # --- 前端静态资源 ---------------------------------------------------------
    location / {
        proxy_pass http://easyoa_web;
    }
}